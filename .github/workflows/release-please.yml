name: Release Please

on:
    push:
        branches: [master]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release-pr: ${{ steps.release.outputs.pr }}
            released: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # Obsidian needs the new version in versions.json, which release-please does
    # not manage. This runs after every release-please run, so the entry is always
    # part of the release PR before it is merged.
    sync-obsidian-files:
        needs: release-please
        if: ${{ needs.release-please.outputs.release-pr != '' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.release-pr).headBranchName }}

            - name: Use Node.js 22.x
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Sync manifest.json and versions.json
              run: node version-bump.mjs

            - name: Commit the synced files
              run: |
                  if git diff --quiet; then
                    echo "Obsidian files are already in sync."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add manifest.json versions.json
                  git commit -m "chore: sync the Obsidian manifest for this release"
                  git push

    # release-please creates the tag and the release; the plugin files Obsidian
    # installs have to be built, attested and attached to it.
    publish-assets:
        needs: release-please
        if: ${{ needs.release-please.outputs.released == 'true' }}
        permissions:
            contents: write
            id-token: write
            attestations: write
        uses: ./.github/workflows/publish-assets.yml
        with:
            tag: ${{ needs.release-please.outputs.tag }}
